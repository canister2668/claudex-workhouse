name: container build preview
on:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  test-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with: { version: 10.17.1 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: pnpm, cache-dependency-path: app/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm test
        working-directory: app
      - run: pnpm run build
        working-directory: app
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          build-args: |
            CLAUDEX_WORKHOUSE_COMMIT_SHA=${{ github.sha }}
          platforms: linux/amd64
          load: true
          push: false
          tags: claudex-workhouse:preview
          provenance: false
          sbom: false
